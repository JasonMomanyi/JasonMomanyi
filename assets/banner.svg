<radialGradient id="gc" cx="80" cy="30" r="400" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#22E4FF" stop-opacity=".18"/><stop offset="1" stop-color="#22E4FF" stop-opacity="0"/></radialGradient>
<radialGradient id="sph" cx="910" cy="133" r="220.8" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#3347C2" stop-opacity=".92"/><stop offset=".55" stop-color="#171B66" stop-opacity=".94"/><stop offset="1" stop-color="#070A1F" stop-opacity=".96"/></radialGradient>
<linearGradient id="tg" gradientUnits="userSpaceOnUse" x1="70" y1="0" x2="720" y2="0"><stop class="g1" offset="0" stop-color="#22E4FF"/><stop class="g2" offset=".55" stop-color="#8B5CF6"/><stop class="g3" offset="1" stop-color="#FF4D8D"/></linearGradient>
<linearGradient id="sc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22E4FF" stop-opacity="0"/><stop offset=".5" stop-color="#22E4FF" stop-opacity=".08"/><stop offset="1" stop-color="#22E4FF" stop-opacity="0"/></linearGradient>
<linearGradient id="bd" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="380"><stop offset="0" stop-color="#22E4FF"/><stop offset=".55" stop-color="#8B5CF6"/><stop offset="1" stop-color="#FF4D8D"/></linearGradient>
<filter id="glow" x="-10%" y="-40%" width="120%" height="180%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="soft" x="-150%" y="-150%" width="400%" height="400%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
