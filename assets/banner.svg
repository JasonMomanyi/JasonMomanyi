<style>

.sans{font-family:'Arial Black','Segoe UI Black','Helvetica Neue',Arial,sans-serif;font-weight:900}.mono{font-family:'JetBrains Mono','Fira Code','SF Mono',Menlo,'Cascadia Code',Consolas,'DejaVu Sans Mono','Courier New',monospace}.ui{font-family:'Segoe UI','SF Pro Text','Helvetica Neue',Arial,sans-serif}
