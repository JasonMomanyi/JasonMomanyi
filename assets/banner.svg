.ring{animation:spin 48s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.dot{animation:dx 14s linear infinite,df 14s linear infinite;animation-delay:var(--d),var(--d)}
@keyframes dx{0%{transform:translateX(calc(var(--a)*-1px));animation-timing-function:cubic-bezier(.37,0,.63,1)}50%{transform:translateX(calc(var(--a)*1px));animation-timing-function:linear}100%{transform:translateX(calc(var(--a)*-1px))}}
@keyframes df{0%{opacity:0}12.5%{opacity:.7}25%{opacity:1}37.5%{opacity:.7}50%,100%{opacity:0}}
.sx0{animation:ox 4.5s ease-in-out infinite alternate;animation-direction:alternate}
.sy0{animation:oy 4.5s ease-in-out infinite alternate;animation-delay:-2.25s;animation-direction:alternate}
.sx1{animation:ox 3.2s ease-in-out infinite alternate;animation-direction:alternate-reverse}
.sy1{animation:oy 3.2s ease-in-out infinite alternate;animation-delay:-1.6s;animation-direction:alternate-reverse}
@keyframes ox{from{transform:translateX(var(--rx))}to{transform:translateX(calc(var(--rx)*-1))}}
@keyframes oy{from{transform:translateY(calc(var(--ry)*-1))}to{transform:translateY(var(--ry))}}
.rp{animation:rp 2.6s ease-out infinite}.rp2{animation-delay:-1.3s}@keyframes rp{0%{transform:scale(1);opacity:.9}100%{transform:scale(8);opacity:0}}
.pin{animation:bob 2.2s ease-in-out infinite alternate}@keyframes bob{to{transform:translateY(-6px)}}
.scan{animation:sn 7s linear infinite}@keyframes sn{from{transform:translateY(0)}to{transform:translateY(480px)}}
.gl1{animation:gl1 5s steps(1,end) infinite}@keyframes gl1{0%,86%{opacity:0;transform:translateX(0)}87%{opacity:.8;transform:translateX(-6px)}89%{opacity:0;transform:translateX(0)}91%{opacity:.6;transform:translateX(5px)}93%,100%{opacity:0;transform:translateX(0)}}
.gl2{animation:gl2 5s steps(1,end) infinite}@keyframes gl2{0%,86%{opacity:0;transform:translateX(0)}87%{opacity:.8;transform:translateX(6px)}89%{opacity:0;transform:translateX(0)}91%{opacity:.6;transform:translateX(-5px)}93%,100%{opacity:0;transform:translateX(0)}}
.bar{animation:bar 4.5s ease-in-out infinite}@keyframes bar{0%,100%{transform:scaleX(.2)}50%{transform:scaleX(1)}}
.k{animation:tk 9s linear infinite}.k2{animation-delay:3s}.k3{animation-delay:6s}@keyframes tk{0%,32%{opacity:1}34%,100%{opacity:0}}
.g1{animation:c1 9s linear infinite}.g2{animation:c2 9s linear infinite}.g3{animation:c3 9s linear infinite}
@keyframes c1{0%,100%{stop-color:#22E4FF}33%{stop-color:#8B5CF6}66%{stop-color:#FF4D8D}}
@keyframes c2{0%,100%{stop-color:#8B5CF6}33%{stop-color:#FF4D8D}66%{stop-color:#22E4FF}}
@keyframes c3{0%,100%{stop-color:#FF4D8D}33%{stop-color:#22E4FF}66%{stop-color:#8B5CF6}}
}
</style>
