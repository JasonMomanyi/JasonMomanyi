<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-labelledby="ttl dsc">
<title id="ttl">Jason Momanyi</title>
<desc id="dsc">Animated banner: a rotating wireframe globe with satellites, a map pin and a drifting graticule behind the name Jason Momanyi.</desc>
<defs>
