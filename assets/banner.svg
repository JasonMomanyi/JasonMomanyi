@media (prefers-reduced-motion:no-preference){
.gridv{animation:gx 6s linear infinite}@keyframes gx{to{transform:translateX(60px)}}
.w0{animation:w0 22s linear infinite}@keyframes w0{to{transform:translateX(-340px)}}
