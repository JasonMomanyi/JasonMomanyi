<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="1200" height="240" role="img" aria-labelledby="ttl dsc">
<title id="ttl">Footer</title>
<desc id="dsc">Layered animated waves above a thank-you note.</desc>
<defs>
<linearGradient id="fa" x1="0" x2="1"><stop offset="0" stop-color="#22E4FF" stop-opacity=".5"/><stop offset="1" stop-color="#8B5CF6" stop-opacity=".5"/></linearGradient>
<linearGradient id="fb" x1="0" x2="1"><stop offset="0" stop-color="#8B5CF6" stop-opacity=".7"/><stop offset="1" stop-color="#FF4D8D" stop-opacity=".7"/></linearGradient>
<linearGradient id="fc" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="0"><stop offset="0" stop-color="#22E4FF"/><stop offset=".5" stop-color="#8B5CF6"/><stop offset="1" stop-color="#FF4D8D"/></linearGradient>
</defs>
<style>
.sans{font-family:'Arial Black','Segoe UI Black','Helvetica Neue',Arial,sans-serif;font-weight:900}.mono{font-family:'JetBrains Mono','Fira Code','SF Mono',Menlo,'Cascadia Code',Consolas,'DejaVu Sans Mono','Courier New',monospace}
@media (prefers-reduced-motion:no-preference){
.fw0{animation:fw0 24s linear infinite}@keyframes fw0{to{transform:translateX(-520px)}}
.fw1{animation:fw1 18s linear infinite}@keyframes fw1{from{transform:translateX(-380px)}to{transform:translateX(0)}}
.fw2{animation:fw2 14s linear infinite}@keyframes fw2{to{transform:translateX(-300px)}}
}
</style>
