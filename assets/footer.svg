<g class="fw2"><path d="M-1200 148Q-1125.0 136 -1050 148T-900 148T-750 148T-600 148T-450 148T-300 148T-150 148T0 148T150 148T300 148T450 148T600 148T750 148T900 148T1050 148T1200 148T1350 148T1500 148T1650 148T1800 148T1950 148T2100 148T2250 148T2400 148T2550 148V240H-1200Z" fill="#0B0E36"/><path d="M-1200 148Q-1125.0 136 -1050 148T-900 148T-750 148T-600 148T-450 148T-300 148T-150 148T0 148T150 148T300 148T450 148T600 148T750 148T900 148T1050 148T1200 148T1350 148T1500 148T1650 148T1800 148T1950 148T2100 148T2250 148T2400 148T2550 148" fill="none" stroke="url(#fc)" stroke-width="2.2"/></g>
<text x="600.0" y="192" text-anchor="middle" class="sans" font-size="30" fill="#FFFFFF" letter-spacing="-.5">thanks for stopping by</text>
<text x="600.0" y="221" text-anchor="middle" class="mono" font-size="14" fill="#22E4FF">keep building, keep mapping, keep breaking things ethically.</text>
</svg>
