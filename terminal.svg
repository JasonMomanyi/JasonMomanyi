<g class="mv mv7"><rect class="cv" x="60.2" y="311" width="825.8" height="24" fill="#0A0E27"/><g class="cg cg7"><rect class="cur" x="63.2" y="313" width="9.6" height="19" fill="#22E4FF"/></g></g>
<text x="44" y="360" class="mono" font-size="16" textLength="19.2" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#5CF28E">$ </tspan></text>
