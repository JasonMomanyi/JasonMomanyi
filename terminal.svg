<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 396" width="900" height="396" role="img" aria-labelledby="ttl dsc">
<title id="ttl">Animated terminal</title>
<desc id="dsc">A terminal window that types out who I am, my interests, what I am learning and my collaboration status.</desc>
<defs>
<linearGradient id="bd" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="900" y2="396"><stop offset="0" stop-color="#22E4FF"/><stop offset=".55" stop-color="#8B5CF6"/><stop offset="1" stop-color="#FF4D8D"/></linearGradient>
<filter id="blur" x="-5%" y="-5%" width="110%" height="110%"><feGaussianBlur stdDeviation="7"/></filter>
<clipPath id="inner"><rect x="9" y="48" width="882" height="339"/></clipPath>
</defs>
<style>

