name: Generate Snake Animation

on:
  # rebuild every 12 hours so the snake keeps eating your newest contributions
  schedule:
    - cron: "0 */12 * * *"
  # lets you run it by hand from the Actions tab
  workflow_dispatch:
  # and rebuild whenever you push to main
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # draws a snake that eats your contribution graph (light + dark variants)
      - name: Generate snake svgs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      # publishes them on an "output" branch the README can point to
      - name: Push snake to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

